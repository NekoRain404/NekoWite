<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NekoWite — WebKitGTK harness</title>
    <!--
      A boot page for engines that cannot be driven by Playwright, so a
      measurement can be taken in the engine that SHIPS (WebKitGTK 4.1, via
      WebKitWebDriver + MiniBrowser) instead of in Chromium.

      `e2e/support/editorHarness.ts` installs its Tauri mock through
      `page.addInitScript`, which is Playwright-only API. WebDriver classic has
      no equivalent — there is no `addScriptToEvaluateOnNewDocument` — so the
      mock is installed by a classic inline script in this page's head, which is
      the same thing at a different level: both run before the app's module
      graph evaluates, which is what `TitleBar.vue`'s module-scope
      `__TAURI_INTERNALS__` read requires.

      This page is served by the app's own frozen dev server (Vite's root is the
      package, so `/e2e/webkit/harness.html` is under it) and boots the real
      `src/main.ts` — the same source the app runs, with no build step and no
      copy of the app. Only the Rust backend is stood in for.

      Scenario is chosen by `?scenario=`, because the document has to exist
      before the app reads it and a WebDriver client cannot hand one in later.

      Two further query parameters, both additive (absent, the page behaves
      exactly as it did before they existed):

        ?words=<n>   sizes the `doc` scenario's document by word count, so the
                     same probe can be run at several sizes and the result read
                     as a curve rather than a point;
        ?agent=1     switches the right rail to the agent panel and stands in
                     for the agent IPC — the commands `tauri-agent/ipc.ts`
                     calls and the `agent-event` channel it listens on — so a
                     streamed answer can be driven into the real panel;
        ?chat=1      seeds a conversation long enough to overflow the rail's
                     transcript, through the same stored document the product
                     reads. The two are mutually exclusive in practice: the
                     agent panel takes the rail over, so a run that asks for
                     both measures the agent panel.
    -->
    <script>
      ;(function () {
        // MiniBrowser keeps a profile between sessions; a stale vault path or a
        // saved pane width from an earlier probe would move the page under a
        // measurement, which is the failure `vite.frozen.config.ts` exists to
        // prevent on the server side.
        localStorage.clear()
        const params = new URLSearchParams(location.search)
        const scenario = params.get('scenario') || 'long'

        const PARAGRAPH =
          'The quick brown fox jumps over the lazy dog, and the measurement it leaves behind ' +
          'is only worth the engine it was taken in. '
        // ~90 paragraphs puts the image roughly 4 000px below the fold, which is
        // the shape of the note that produced the Chromium number: an image the
        // reader has scrolled TO, with the document's own top far off-screen.
        const long = ['---', 'title: Long', '---', '', '# Note with a picture far down the page', '']
        for (let i = 0; i < 90; i++) long.push(PARAGRAPH + `(paragraph ${i + 1})`, '')

        /**
         * A document of a given size, built by WORD COUNT rather than by
         * paragraph count: "长文档" is measured in words, and a fixture that
         * hits its target by counting paragraphs would drift from the number it
         * claims the moment the paragraph text changed.
         *
         * Headings every 24 paragraphs and a fenced code block now and then, so
         * the document is a document and not 3 000 identical lines — the
         * rendered parser's cost depends on the node mix, and a fixture that is
         * one node type measures one node type.
         */
        function documentOfWords(target) {
          const perParagraph = PARAGRAPH.trim().split(/\s+/).length
          const count = Math.max(1, Math.round(target / perParagraph))
          const out = ['---', 'title: Long document', '---', '', `# Long document (${target} words)`, '']
          for (let i = 0; i < count; i++) {
            if (i > 0 && i % 24 === 0) out.push(`## Section ${i / 24 + 1}`, '')
            out.push(PARAGRAPH + `(paragraph ${i + 1})`, '')
            if (i > 0 && i % 48 === 0) {
              out.push('```ts', `const marker${i} = ${i}`, '```', '')
            }
          }
          return { text: out.join('\n'), paragraphs: count, words: count * perParagraph }
        }

        const long_ = long.join('\n')
        const docs = {
          long: long_,
          plain: [
            '---',
            'title: Plain',
            '---',
            '',
            '# Note with table and image',
            '',
            '| Name | Value |',
            '| --- | --- |',
            '| one | 1 |',
            '| two | 2 |',
            '',
            '![pic](attachments/2026-09/pic.png){width=120}',
          ].join('\n'),
        }
        // A note shaped like the one the reader reported, so the measurement is
        // of their situation rather than of one arranged to be convenient: a
        // table holding BOTH ways a blank cell is written in the wild — one the
        // author left empty, and one carrying the `<br />` marker an earlier
        // version of this app wrote, which is what most existing notes hold.
        docs.table = [
          '---',
          'title: Table',
          '---',
          '',
          '# Note with empty cells',
          '',
          '| Name | Value |',
          '| --- | --- |',
          '| one | 1 |',
          '| <br /> |  |',
          '',
        ].join('\n')
        // The image is the LAST node, so the tail space below it is the pane's
        // own pad and nothing else — which is what the tail-space probe reads.
        docs.long = [long_, '![pic](attachments/2026-09/pic.png){width=120}'].join('\n')

        // The sized document. `words` is absent in every pre-existing run, so
        // this scenario is only ever reached when a caller asks for it.
        const sized = documentOfWords(Number(params.get('words') || '2000'))
        docs.doc = sized.text

        // Two long notes, for the one measurement a single note cannot take:
        // whether a scroll offset survives from one document into the next. The
        // second is the longer of the two so an offset carried out of the first
        // is never disguised as the second one's own maximum.
        const noteBody = (label, count) => {
          const out = [`# Note ${label}`, '']
          for (let i = 0; i < count; i++) out.push(PARAGRAPH + `(${label} paragraph ${i + 1})`, '')
          return out.join('\n')
        }
        const twoNotes = {
          'two-notes.md': noteBody('first', 40),
          'second.md': noteBody('second', 80),
        }

        const VAULT = 'test-fixtures'
        const NAME = `${scenario}.md`
        const FILES = scenario === 'two-notes' ? twoNotes : { [NAME]: docs[scenario] }
        const fixtures = Object.keys(FILES).map((name) => ({
          name,
          path: `${VAULT}/${name}`,
          is_dir: false,
          is_mdx: true,
        }))

        let n = 0
        const registry = {}
        window.__saves = []
        // What the app actually wrote, not only where. `__saves` is a list of
        // paths and stays exactly that, because the probes that read it count
        // writes; this is the parallel record of the BYTES, for a measurement
        // that is about the file's content rather than about a write occurring.
        window.__saveWrites = []
        window.__NEKO_PICK_QUEUE__ = []

        // ---- The agent IPC stand-in ----------------------------------------
        //
        // Built only when `?agent=1`. It is the smallest thing that satisfies
        // `tauri-agent/ipc.ts` and `agent-rail.ts`: a runtime handle, a session,
        // an empty snapshot, and a live `agent-event` channel. The frames that
        // stream into the panel are written by `__NEKO_AGENT__.push`, which is
        // how a probe drives the panel without a Rust process — the mapping,
        // the reducer, the store and the DOM are all the app's own.
        const agentOn = params.get('agent') === '1'
        const AGENT = {
          agentId: 'probe-agent',
          profileId: 'probe-profile',
          runtimeEpoch: 'probe-epoch-1',
          sessionId: 'probe-session-1',
        }
        /** Registered `agent-event` handlers, keyed by the id
         *  `transformCallback` answered with. The app registers exactly one. */
        const agentListeners = new Map()
        let agentEventSeq = 0
        let agentRun = null

        const agentIdentity = () => ({
          agentId: AGENT.agentId,
          profileId: AGENT.profileId,
          runtimeEpoch: AGENT.runtimeEpoch,
          vaultId: VAULT,
          sessionId: AGENT.sessionId,
        })

        window.__NEKO_AGENT__ = {
          identity: agentIdentity,
          /** Every frame this page pushed, so a probe can report what it sent. */
          sent: 0,
          /**
           * One host frame, in the shape `readFrameShape` validates and
           * `mapHostFrame` maps. `kind` and `payload` are the contract's, not
           * the runtime's: this stands in for the Rust side, which is what
           * normalizes.
           */
          push: function (kind, payload, runId) {
            agentEventSeq += 1
            const frame = {
              ...agentIdentity(),
              runId: runId === undefined ? agentRun : runId,
              sequence: agentEventSeq,
              kind: kind,
              payload: payload,
            }
            window.__NEKO_AGENT__.sent += 1
            for (const id of agentListeners.values()) {
              registry[id]({ event: 'agent-event', id: agentEventSeq, payload: frame })
            }
            return agentEventSeq
          },
          /** The host's run id, once a prompt has been answered. */
          runId: function () {
            return agentRun
          },
          /**
           * The word a chunk carries. Constant, so a chunk's own size is not a
           * variable in a measurement of how the panel handles chunks.
           */
          chunk: 'streaming ',
        }

        window.__TAURI_INTERNALS__ = {
          /**
           * Which window this context is, in the shape `@tauri-apps/api` reads — the same two
           * fields the package's own `mockWindows` installs, so this is copied from the
           * backend it stands in for rather than invented here.
           *
           * It is load-bearing for one caller and one only: the agent composition asks for the
           * window's label when it binds the live-note responder, and with `metadata` absent
           * that read throws, `agent-rail` reports the throw as a refusal, and the rail shows
           * 「the agent engine could not be started」 over the panel it was supposed to host.
           * Nothing in this harness had ever mounted the panel, so nothing had ever asked.
           */
          metadata: {
            currentWindow: { label: 'main' },
            currentWebview: { windowLabel: 'main', label: 'main' },
          },
          invoke: async function (cmd, args) {
            args = args || {}
            if (cmd === 'register_vault') return undefined
            // A `.tmp` scan at startup must come back empty: fixtures for every
            // path make the crash-recovery prompt appear and cover the editor.
            if (cmd === 'list_dir') {
              const path = String(args.path == null ? '' : args.path)
              return path === '' || path === VAULT ? fixtures : []
            }
            if (cmd === 'read_file') {
              const name = String(args.path || '').split('/').pop()
              return FILES[name] === undefined ? '' : FILES[name]
            }
            if (cmd === 'stat_file') return { size: 1, mtime: 1 }
            if (cmd === 'write_file') {
              window.__saves.push(String(args.path))
              window.__saveWrites.push({
                path: String(args.path),
                content: String(args.content == null ? '' : args.content),
              })
              return undefined
            }
            if (cmd === 'delete_file') return 'trash/x'
            if (cmd === 'watch_folder') return undefined
            if (cmd === 'save_attachment') return 'attachments/2026-09/paste-x.png'
            // Deliberately unresolvable. `<img>` fails, the node view draws its
            // error overlay, and that overlay's message span is the ONE region of
            // the figure that does not arm a resize drag — so a real click there
            // becomes a NodeSelection, which is what opens the panel. The
            // `width=120` attribute still sizes the figure either way.
            if (cmd === 'resolve_media_path') {
              throw new Error('no such attachment: ' + String(args.rel_path || ''))
            }
            if (cmd === 'create_dir') return 'attachments'
            if (cmd === 'list_history') return []
            if (cmd === 'open_folder_dialog') return null
            if (cmd === 'save_file_dialog') return `${VAULT}/untitled.md`
            if (cmd === 'list_trash') return []
            if (cmd === 'plugin:event|listen') {
              // `listen()` passes the id `transformCallback` minted, and the
              // host answers an event id. Only the agent channel is kept: the
              // app's other listeners are not this harness's business, and the
              // existing probes depend on `plugin:event|listen` being inert.
              const eventId = ++n
              if (agentOn && args.event === 'agent-event') agentListeners.set(eventId, args.handler)
              return eventId
            }
            if (cmd === 'plugin:event|unlisten') {
              agentListeners.delete(args.eventId)
              return undefined
            }
            if (!agentOn) return undefined
            if (cmd === 'agent_start') {
              return {
                agentId: AGENT.agentId,
                profileId: AGENT.profileId,
                runtimeEpoch: AGENT.runtimeEpoch,
              }
            }
            if (cmd === 'agent_open_session') {
              // The engine's own two options, not an empty list. `session/new` answers with
              // the config options the session opened with, and the pinned engine reports two
              // of them — `{id: "model", name: "Model", currentValue: "opencode/big-pickle"}`
              // and `{id: "mode", name: "Session Mode", currentValue: "build"}`, read off a
              // real session (`src/features/agent/services/agent-config-options.ts` records
              // the same reading).
              //
              // An empty list here was not neutral: `AgentConfigRow` draws nothing when the
              // session reports nothing, so a page that answered `[]` rendered a composer bar
              // with three children instead of five — and a width measured on it would have
              // been a green about a bar the product does not have. The row the controls
              // occupy is the widest thing in the bar, and every width question this harness
              // now asks is a question about it.
              return {
                sessionId: AGENT.sessionId,
                modelOptionId: 'model',
                configOptions: [
                  {
                    id: 'model',
                    name: 'Model',
                    type: 'select',
                    currentValue: 'opencode/big-pickle',
                    options: [
                      { value: 'opencode/big-pickle', name: 'Big Pickle' },
                      { value: 'opencode/little-pickle', name: 'Little Pickle' },
                    ],
                  },
                  {
                    id: 'mode',
                    name: 'Session Mode',
                    type: 'select',
                    currentValue: 'build',
                    options: [
                      { value: 'build', name: 'Build' },
                      { value: 'plan', name: 'Plan' },
                    ],
                  },
                ],
              }
            }
            if (cmd === 'agent_session_snapshot') {
              return {
                identity: agentIdentity(),
                state: 'ready',
                runId: null,
                sequence: 0,
                events: [],
                permissions: [],
              }
            }
            if (cmd === 'agent_prompt') {
              agentRun = 'probe-run-1'
              return agentRun
            }
            if (cmd === 'agent_cancel_run') return undefined
            if (cmd === 'agent_permission_answer') return undefined
            if (cmd === 'agent_set_config_option') return undefined
            if (cmd === 'agent_session_capabilities') return []
            if (cmd === 'agent_stop') return undefined
            if (cmd === 'agent_registry_read') {
              return {
                entries: [
                  {
                    agentId: AGENT.agentId,
                    displayName: 'Probe engine',
                    enabled: true,
                    profileId: AGENT.profileId,
                  },
                ],
              }
            }
            return undefined
          },
          convertFileSrc: function (p) {
            return p
          },
          transformCallback: function (cb) {
            registry[++n] = cb
            return n
          },
          unregisterCallback: function () {},
        }
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: function () {} }

        // ---- The chat transcript's fixture ---------------------------------
        //
        // `?chat=1` seeds a conversation through the STORED DOCUMENT the product
        // itself reads (`nekowite.chat.sessions`, written by
        // `chat-session-storage.ts` and sanitised on the way back in), so what
        // mounts is the app's own panel over the app's own state rather than a
        // panel a probe built. A probe that injected messages by calling a store
        // would be measuring its own injection.
        //
        // The length is the point. A transcript that does not overflow cannot
        // answer a single question a scroll probe asks, and "nothing moved" is
        // what an empty one says to all of them — the pass-for-the-wrong-reason
        // shape every trace in this harness refuses. Enough turns to be several
        // screens deep, each a few lines, so the container's maximum is well
        // clear of its viewport whatever the rail's width is set to.
        const chatOn = params.get('chat') === '1'
        if (chatOn) {
          const turns = []
          for (let i = 0; i < 40; i++) {
            turns.push({ role: 'user', content: `Question ${i + 1}: ${PARAGRAPH.replace(/\s+/g, ' ').trim()}` })
            turns.push({
              role: 'assistant',
              content: `Answer ${i + 1}: ${PARAGRAPH.replace(/\s+/g, ' ').trim()}${PARAGRAPH.replace(/\s+/g, ' ').trim()}`,
            })
          }
          localStorage.setItem(
            'nekowite.chat.sessions',
            JSON.stringify({
              v: 1,
              activeId: 'probe-session',
              sessions: [
                {
                  id: 'probe-session',
                  title: 'Probe conversation',
                  created: 1,
                  updated: 2,
                  messages: turns,
                },
              ],
            }),
          )
        }

        localStorage.setItem('nekowite.vault', VAULT)
        localStorage.setItem('nekowite.locale', 'en')
        localStorage.setItem('nekowite.settings.autosaveInterval', 'off')
        // The rail's switch. Off by default in the product (an engine has to be
        // there for the panel to be honest about), on here because the panel is
        // what this scenario is measuring.
        if (agentOn) localStorage.setItem('nekowite.agent.panel', 'true')
        window.__NEKO_HARNESS__ = {
          scenario: scenario,
          note: NAME,
          vault: VAULT,
          agent: agentOn,
          chat: chatOn,
          document: scenario === 'doc' ? sized : null,
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
