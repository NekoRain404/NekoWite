<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NekoWite — WebKitGTK harness</title>
    <!--
      A boot page for engines that cannot be driven by Playwright, so a
      measurement can be taken in the engine that SHIPS (WebKitGTK 4.1, via
      WebKitWebDriver + MiniBrowser) instead of in Chromium.

      `e2e/support/editorHarness.ts` installs its Tauri mock through
      `page.addInitScript`, which is Playwright-only API. WebDriver classic has
      no equivalent — there is no `addScriptToEvaluateOnNewDocument` — so the
      mock is installed by a classic inline script in this page's head, which is
      the same thing at a different level: both run before the app's module
      graph evaluates, which is what `TitleBar.vue`'s module-scope
      `__TAURI_INTERNALS__` read requires.

      This page is served by the app's own frozen dev server (Vite's root is the
      package, so `/e2e/webkit/harness.html` is under it) and boots the real
      `src/main.ts` — the same source the app runs, with no build step and no
      copy of the app. Only the Rust backend is stood in for.

      Scenario is chosen by `?scenario=`, because the document has to exist
      before the app reads it and a WebDriver client cannot hand one in later.
    -->
    <script>
      ;(function () {
        // MiniBrowser keeps a profile between sessions; a stale vault path or a
        // saved pane width from an earlier probe would move the page under a
        // measurement, which is the failure `vite.frozen.config.ts` exists to
        // prevent on the server side.
        localStorage.clear()
        const scenario = new URLSearchParams(location.search).get('scenario') || 'long'

        const PARAGRAPH =
          'The quick brown fox jumps over the lazy dog, and the measurement it leaves behind ' +
          'is only worth the engine it was taken in. '
        // ~90 paragraphs puts the image roughly 4 000px below the fold, which is
        // the shape of the note that produced the Chromium number: an image the
        // reader has scrolled TO, with the document's own top far off-screen.
        const long = ['---', 'title: Long', '---', '', '# Note with a picture far down the page', '']
        for (let i = 0; i < 90; i++) long.push(PARAGRAPH + `(paragraph ${i + 1})`, '')

        const docs = {
          long: long.join('\n'),
          plain: [
            '---',
            'title: Plain',
            '---',
            '',
            '# Note with table and image',
            '',
            '| Name | Value |',
            '| --- | --- |',
            '| one | 1 |',
            '| two | 2 |',
            '',
            '![pic](attachments/2026-09/pic.png){width=120}',
          ].join('\n'),
        }
        const long_ = docs.long
        // The image is the LAST node, so the tail space below it is the pane's
        // own pad and nothing else — which is what the tail-space probe reads.
        docs.long = [long_, '![pic](attachments/2026-09/pic.png){width=120}'].join('\n')

        const VAULT = 'test-fixtures'
        const NAME = `${scenario}.md`
        const DOC = docs[scenario]
        const fixtures = [{ name: NAME, path: `${VAULT}/${NAME}`, is_dir: false, is_mdx: true }]

        let n = 0
        const registry = {}
        window.__saves = []
        window.__NEKO_PICK_QUEUE__ = []

        window.__TAURI_INTERNALS__ = {
          invoke: async function (cmd, args) {
            args = args || {}
            if (cmd === 'register_vault') return undefined
            // A `.tmp` scan at startup must come back empty: fixtures for every
            // path make the crash-recovery prompt appear and cover the editor.
            if (cmd === 'list_dir') {
              const path = String(args.path == null ? '' : args.path)
              return path === '' || path === VAULT ? fixtures : []
            }
            if (cmd === 'read_file') return String(args.path || '').endsWith(NAME) ? DOC : ''
            if (cmd === 'stat_file') return { size: 1, mtime: 1 }
            if (cmd === 'write_file') {
              window.__saves.push(String(args.path))
              return undefined
            }
            if (cmd === 'delete_file') return 'trash/x'
            if (cmd === 'watch_folder') return undefined
            if (cmd === 'save_attachment') return 'attachments/2026-09/paste-x.png'
            // Deliberately unresolvable. `<img>` fails, the node view draws its
            // error overlay, and that overlay's message span is the ONE region of
            // the figure that does not arm a resize drag — so a real click there
            // becomes a NodeSelection, which is what opens the panel. The
            // `width=120` attribute still sizes the figure either way.
            if (cmd === 'resolve_media_path') {
              throw new Error('no such attachment: ' + String(args.rel_path || ''))
            }
            if (cmd === 'create_dir') return 'attachments'
            if (cmd === 'list_history') return []
            if (cmd === 'open_folder_dialog') return null
            if (cmd === 'save_file_dialog') return `${VAULT}/untitled.md`
            if (cmd === 'list_trash') return []
            if (cmd === 'plugin:event|listen') return ++n
            return undefined
          },
          convertFileSrc: function (p) {
            return p
          },
          transformCallback: function (cb) {
            registry[++n] = cb
            return n
          },
          unregisterCallback: function () {},
        }
        window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: function () {} }

        localStorage.setItem('nekowite.vault', VAULT)
        localStorage.setItem('nekowite.locale', 'en')
        localStorage.setItem('nekowite.settings.autosaveInterval', 'off')
        window.__NEKO_HARNESS__ = { scenario: scenario, note: NAME, vault: VAULT }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
