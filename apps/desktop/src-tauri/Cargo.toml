[package]
name = "nekowite"
version = "1.0.0"
edition = "2021"

[lib]
name = "nekowite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
notify = "7"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
tauri-plugin-stronghold = "2"
getrandom = "0.2"
sha2 = "0.10"
iota_stronghold = "2"
base64 = "0.22"
chrono = "0.4"
# Argon2id password-based KDF for the master password (rust-argon2); already a
# transitive dependency of tauri-plugin-stronghold, so no new build cost.
rust-argon2 = "2"
# The ACP Rust SDK — the same crate, at the same pinned version, that Zed's
# `agent_servers` uses (`agent-client-protocol = { version = "=2.1.0", features
# = ["unstable"] }`). It owns newline framing, JSON-RPC, request/response
# correlation, the schema types and the child-process lifecycle, so the runtime
# in `src/agent_runtime` does not re-implement any of them.
#
# `unstable` is enabled because Zed enables it, and because it is what gates
# `usage` on a prompt response — P0 §2.3 measured the engine returning usage on
# every turn, and the field would otherwise be invisible to us.
agent-client-protocol = { version = "=2.1.0", features = ["unstable"] }
# The single-instance guard is a D-Bus well-known name on the session bus, and the bus is the
# only place its outcome can be read: the plugin records a *successful* claim in a private state
# type of its own, and every other failure disappears into a silent match arm
# (`tauri-plugin-single-instance 2.4.4`, `platform_impl/linux.rs:88`). `src/instance_guard.rs`
# asks the bus the question the plugin asked, so "two instances are sharing this profile and
# nothing anywhere says so" stops being possible. `zbus` is already in the lock file at 5.19.0
# as that plugin's own Linux dependency, default features and all, so this makes an existing
# crate direct rather than adding one — the same move `libc` above already made. Linux-only,
# like the plugin's use of it.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# A native terminal (§4.3) needs a pty, and a pty is a pair of descriptors only the kernel can
# make: `posix_openpt`/`grantpt`/`unlockpt`/`ptsname_r`, one `TIOCSWINSZ`, `setsid` +
# `TIOCSCTTY` in the child, and `kill(-pgid)` to end the group. `libc` is already in the lock
# file as a transitive dependency (`0.2.189`), so this makes an existing crate direct rather
# than adding one. The mature PTY crate §4.3 asks for is still an unapproved dependency; this
# is the substitutable half of it.
libc = "0.2"

[dev-dependencies]
# `tauri::test` (MockRuntime, `mock_builder`) is behind tauri's `test` feature,
# which is off in a normal build. The asset-scope test builds the app from
# `tauri.conf.json` the same way `lib.rs` does, so the scope it asks about is
# the one the app installs rather than a re-creation of it. The feature is empty
# (`test = []`), so it adds nothing to the shipped binary.
tauri = { version = "2", features = ["test"] }
